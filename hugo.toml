baseURL = 'https://hesrami.github.io/'
languageCode = 'en-gb'
defaultContentLanguage = "en-gb"
title = "rami's blog"


[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome"

   [module.hugoVersion]
    extended = true
    min = "0.87.0"


# Enable emojis globally
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"] # ignore error of loading additional scripts.


[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
	[markup.tableOfContents]
		startLevel = 2 # ToC starts from H2
		endLevel = 4 # ToC ends at H4
		ordered = false 



[Languages.en-gb.menu]
  [[Languages.en-gb.menu.main]]
    pageRef="/"
    name = 'Home'
    url = '/'
    weight = 10
  [[Languages.en-gb.menu.main]]
    pageRef="posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[Languages.en-gb.menu.main]]
    pageRef="about"
    name = 'About'
    url = '/about/'
    weight = 30


[Languages.en-gb.params]
  sitename = "rami's blog"
  defaultColor = "dark" 
  description = "offensive security research"
  mainSections = ['posts']
  toc = true
  tocOpen = false # set to true to open table of contents by default
  goToTop = true

  dateFormat = "" 
  rssFeedDescription = "summary" 

[Languages.en-gb.params.author]
  avatar = "avatar.jpg"         #/assets/avatar.jpg
  intro = "rami's blog"
  name = "Daniel J"
  description = "Offensive security research"

[[params.socialIcons]]
name = "x"
url = "https://x.com/miiide__"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/daninyourcomputer/"